name: Compilar y publicar Puente

# Vive en caezone08-star/puente-releases, que es publico: ahi GitHub no cobra minutos, tampoco los
# del Mac. La fuente sigue privada: se lee con un token de solo lectura (secreto
# PUENTE_SOURCE_TOKEN) y en este repositorio solo quedan los instaladores, como siempre.
# El 2026-09-23 el cupo de minutos del repositorio privado se agoto y la 0.1.14 no pudo salir.
#
# La copia que manda es .github/publicar-gratis/compilar.yml en la fuente privada; esta es su copia.
# Las pruebas de Windows corren antes en el PC del dueno (app:refresh). Las de Mac corren aqui con la
# salida guardada en un archivo: el registro publico solo dice cuantas pasaron y cuales fallaron.
# Los avisos del compilador se silencian porque imprimen lineas de codigo.
# Se lanza a mano: gh workflow run compilar.yml -R caezone08-star/puente-releases -f ref=<commit>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit de la fuente privada que se publica
        required: true
      notas:
        description: Que cambio en esta version, en palabras del dueno
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar ${{ matrix.plataforma }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            plataforma: windows-x86_64
            bundles: nsis
          - os: macos-14
            plataforma: darwin-aarch64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
    steps:
      - name: Obtener fuente privada
        uses: actions/checkout@v4
        with:
          repository: caezone08-star/Proyecto-Puente-Padre
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PUENTE_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
      # Guardar lo compilado entre versiones: sin esto Windows tardaba 11 minutos compilando todo desde
      # cero (corrida 35944585049). Lo guardado equivale a lo que ya trae el instalador publico.
      - name: Reusar lo compilado antes
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Instalar dependencias reproducibles
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Compilar y firmar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Reunir lo que se publica
        run: node scripts/reunir-publicacion.mjs ${{ matrix.plataforma }} publicar
      - name: Guardar la compilacion
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plataforma }}
          path: publicar/
          retention-days: 1

  # Las pruebas de Mac corren aqui porque es gratis, con la salida guardada en un archivo que no se
  # publica: el registro publico solo dice cuantas pasaron y el nombre de las que fallaron. Sin este
  # trabajo ninguna prueba corria en un Mac antes de publicar (hallazgo
  # finding-con-la-publicacion-gratis-las-pruebas-de-mac-dejaron-de-correr-antes-de-cada-version-1790219870961).
  probar-mac:
    name: Pruebas en macOS
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Awarnings
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    defaults:
      run:
        shell: bash
    steps:
      - name: Obtener fuente privada
        uses: actions/checkout@v4
        with:
          repository: caezone08-star/Proyecto-Puente-Padre
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PUENTE_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Reusar lo compilado antes
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Preparar la maquina como la deja la app
        run: |
          npm ci --no-audit --no-fund --loglevel=error > "$RUNNER_TEMP/preparar.log" 2>&1
          npm run build >> "$RUNNER_TEMP/preparar.log" 2>&1
          cargo install --debug --locked --path src-tauri --bin puente-agent --target-dir src-tauri/target >> "$RUNNER_TEMP/preparar.log" 2>&1
          cargo run --manifest-path src-tauri/Cargo.toml --bin puente-agent -- protocol-adopt-bundled >> "$RUNNER_TEMP/preparar.log" 2>&1
          cargo run --manifest-path src-tauri/Cargo.toml --bin puente-agent -- parent-state-restore >> "$RUNNER_TEMP/preparar.log" 2>&1
          git config --global user.name "Validar Puente"
          git config --global user.email "validar-puente@users.noreply.github.com"
          echo "maquina preparada"
      - name: Probar contratos
        run: |
          set +e
          npm run test:boundaries > "$RUNNER_TEMP/contratos.log" 2>&1
          codigo=$?
          grep -E '^# (pass|fail) ' "$RUNNER_TEMP/contratos.log"
          grep -E '^not ok ' "$RUNNER_TEMP/contratos.log" | sed -E 's/^not ok [0-9]+ - /falla: /'
          exit $codigo
      - name: Probar nucleo Rust
        run: |
          set +e
          npm run validate:tauri > "$RUNNER_TEMP/rust.log" 2>&1
          codigo=$?
          grep -E '^test result: ' "$RUNNER_TEMP/rust.log"
          grep -E '^test .* FAILED$' "$RUNNER_TEMP/rust.log"
          exit $codigo

  publicar:
    name: Publicar la version
    needs: [compilar, probar-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Obtener fuente privada
        uses: actions/checkout@v4
        with:
          repository: caezone08-star/Proyecto-Puente-Padre
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PUENTE_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Traer las compilaciones
        uses: actions/download-artifact@v4
        with:
          path: publicar
          merge-multiple: true
      - name: Unir las plataformas en latest.json
        run: node scripts/reunir-publicacion.mjs --manifiesto publicar
      - name: Subir y releer
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notas }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" --repo "${{ github.repository }}" --title "Puente $version" --notes "${NOTAS:-Puente $version}" publicar/latest.json publicar/Puente_*
          gh release download "v$version" --repo "${{ github.repository }}" --pattern latest.json --output leido.json
          node -e "const a=require('./leido.json'),b=require('./publicar/latest.json');if(a.version!==b.version||Object.keys(a.platforms).length!==2)process.exit(1);console.log('Publicada',a.version,'para',Object.keys(a.platforms).join(' y '))"
